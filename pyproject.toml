[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[project]
name = "twitter2album"
version = "2024.04.17"
requires-python = ">= 3.11"
dependencies = [
    "tomli",
    "atproto",
    "twscrape[curl]",
    "pyrotgfork[fast]",
    "uvloop",
    "aiohttp",
    "prettyprinter",
]

[project.scripts]
twitter2album-bot = "twitter2album:main"

[tool.hatch.build.targets.wheel]
packages = ["src/twitter2album"]

[tool.uv.sources]
tgcrypto = {
    git = "https://github.com/TelegramPlayground/pyrogram-tgcrypto",
    tag = "v1.2.12",
    marker = "sys_platform == 'linux' and platform_machine == 'aarch64'"
}
